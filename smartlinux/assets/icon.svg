<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Drive Enclosure Shadow/Body -->
  <rect x="96" y="80" width="320" height="352" rx="36" fill="url(#metalGrad)" stroke="#475569" stroke-width="4"/>

  <!-- Top Drive Connector Pins -->
  <rect x="140" y="86" width="36" height="10" rx="3" fill="#e2e8f0" opacity="0.8"/>
  <rect x="190" y="86" width="70" height="10" rx="3" fill="#e2e8f0" opacity="0.8"/>
  <rect x="274" y="86" width="98" height="10" rx="3" fill="#e2e8f0" opacity="0.8"/>

  <!-- Glowing Health Ring (Gauge) -->
  <circle cx="256" cy="236" r="100" fill="none" stroke="#1e293b" stroke-width="20"/>
  <circle cx="256" cy="236" r="100" fill="none" stroke="url(#glowRing)" stroke-width="20" stroke-linecap="round" stroke-dasharray="480" stroke-dashoffset="110" filter="url(#glow)"/>

  <!-- Central Microchip Core -->
  <rect x="206" y="186" width="100" height="100" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>

  <!-- S.M.A.R.T. ECG Diagnostic Pulse Line -->
  <path d="M 140 236 L 195 236 L 215 200 L 235 272 L 256 195 L 275 255 L 295 236 L 372 236" 
        fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Multi-Status LED Indicators -->
  <circle cx="160" cy="380" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="352" cy="380" r="14" fill="#6366f1" opacity="0.8"/>

  <!-- Tech Accent Lines -->
  <line x1="130" y1="340" x2="382" y2="340" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>
</svg>
